        <nav class="flex-1 p-4">
            <p class="text-xs text-gray-400 px-4 mb-2">MAIN NAVIGATION</p>

                <li class="flex items-center gap-3 px-4 py-3 hover:bg-gray-800 rounded-lg cursor-pointer">
                    <i class="fas fa-key"></i>
                    <a href="../ganti_password.html">GANTI PASSWORD</a>
                </li>
                <li class="flex items-center gap-3 px-4 py-3 hover:bg-gray-800 rounded-lg cursor-pointer">
                    <i class="fas fa-sign-out-alt"></i>
                    <!-- <a href="../login.html">LOGOUT</a> -->
                </li>
            </ul>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1">
        <!-- HEADER -->
        <header class="bg-blue-600 text-white px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-semibold">Edit User</h1>
                <span class="text-blue-200">Data User</span>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <img src="https://i.pravatar.cc/32?u=raply" alt="Raply" class="w-8 h-8 rounded-full">
                    <div>
                        <p class="font-medium text-sm">Raply</p>
                        <p class="text-xs text-blue-200">Admin</p>
                    </div>
                </div>
                <button onclick="alert('Logout berhasil')"
                    class="flex items-center gap-2 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm">
                    <i class="fas fa-sign-out-alt"></i> LOGOUT
                </button>
            </div>
        </header>

        <main class="p-8">

            <!-- Breadcrumb
            <div class="mb-8">

                <h1 class="text-3xl font-bold text-gray-800">
                    Tambah Barang
                </h1>

                <p class="text-gray-500 mt-2">
                    Dashboard /
                    <span class="text-blue-600">Data Barang</span>
                    /
                    Tambah Barang
                </p>

            </div> -->

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-lg">

                <div class="border-b px-8 py-6">

                    <h2 class="text-xl font-semibold text-gray-800">
                        Form Data User
                    </h2>

                    <p class="text-gray-500 text-sm mt-1">
                        Perbarui data pengguna InventarisLab.
                    </p>

                </div>


                <form id="formUser" class="p-8">


                    <div class="grid grid-cols-2 gap-8">


                        <!-- Nama -->

                        <div>

                            <label class="font-semibold text-gray-700">
                                Nama Lengkap
                            </label>


                            <div class="relative mt-2">

                                <i class="fas fa-user absolute left-4 top-4 text-gray-400"></i>


                                <input id="nama" type="text" placeholder="Masukkan nama lengkap"
                                    class="w-full border rounded-xl pl-12 pr-4 py-3">


                            </div>


                        </div>




                        <!-- NIM -->

                        <div>

                            <label class="font-semibold text-gray-700">
                                NIM/ NIDN
                            </label>


                            <div class="relative mt-2">

                                <i class="fas fa-id-card absolute left-4 top-4 text-gray-400"></i>


                                <input id="nim" type="text" placeholder="Masukkan NIM/ NIDN"
                                    class="w-full border rounded-xl pl-12 pr-4 py-3">


                            </div>

                        </div>




                        <!-- Email -->

                        <div>

                            <label class="font-semibold text-gray-700">
                                Email
                            </label>


                            <div class="relative mt-2">

                                <i class="fas fa-envelope absolute left-4 top-4 text-gray-400"></i>


                                <input id="email" type="email" placeholder="Email pengguna"
                                    class="w-full border rounded-xl pl-12 pr-4 py-3">


                            </div>


                        </div>




                        <!-- Password -->

                        <div>

                            <label class="font-semibold text-gray-700">
                                Password
                            </label>


                            <div class="relative mt-2">


                                <i class="fas fa-lock absolute left-4 top-4 text-gray-400"></i>


                                <input id="password" type="password" placeholder="Password"
                                    class="w-full border rounded-xl pl-12 pr-4 py-3">


                            </div>


                        </div>




                        <!-- Role -->

                        <div>


                            <label class="font-semibold text-gray-700">
                                Role
                            </label>


                            <select id="role" class="w-full border rounded-xl mt-2 px-4 py-3">


                                <option value="">
                                    Pilih Role
                                </option>

                                <option value="Kajur">
                                    Kajur
                                </option>


                                <option value="Mahasiswa">
                                    Mahasiswa
                                </option>


                            </select>


                        </div>


                    </div>


                    <!-- Button -->

                    <div class="flex justify-end gap-4 mt-10">


                        <a href="users.html" class="px-6 py-3 rounded-xl border font-medium hover:bg-gray-100">

                            Kembali

                        </a>


                        <button type="submit"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold">


                            <i class="fas fa-floppy-disk mr-2"></i>

                            Update User


                        </button>


                    </div>


                </form>


            </div>

        </main>


    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/supabase.js"></script>
    <script src="../assets/edit_user.js"></script>
    <script src="../assets/logout.js"></script>


</body>

</html>
